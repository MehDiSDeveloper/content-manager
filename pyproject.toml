[project]
name = "podcast-workspace"
version = "0.1.0"
description = "Local-first workspace for a solo Persian-language podcaster."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "rapidfuzz>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.gui-scripts]
podcast-workspace = "podcast_workspace.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/podcast_workspace/repositories/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "N", "PTH"]
# RUF001-003 flag Persian letters as "ambiguous unicode"; Persian UI text is intentional.
ignore = ["RUF001", "RUF002", "RUF003", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"src/podcast_workspace/ui/**" = ["N802"]  # Qt override names (closeEvent, ...)
