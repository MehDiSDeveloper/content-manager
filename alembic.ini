# CLI use only (`alembic revision --autogenerate -m "..."`, `alembic upgrade head`).
# The app itself migrates programmatically via podcast_workspace.repositories.db.migrate().
# With no sqlalchemy.url set, env.py targets the real DB in %APPDATA%\PodcastWorkspace
# (or PODCAST_WORKSPACE_HOME when set).

[alembic]
script_location = src/podcast_workspace/repositories/migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
